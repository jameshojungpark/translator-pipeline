# fly.toml app configuration file generated for worshiponair-sermon-translator on 2026-07-28T00:15:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "worshiponair-sermon-translator"
# Pick the region closest to the church (fly platform regions lists them).
primary_region = "nrt"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/health', timeout = '5s' }]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '768mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 768
  processes = ['app']
